<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UFGium — три стола</title>
<style>
  :root {
    --bg: #10161f;
    --ink: #e8eef8;
    --muted: #9aa8bd;
    --gold: #d4b36a;
    --red: #c45c5c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.4 "Segoe UI", system-ui, sans-serif;
  }
  header.page {
    padding: 22px 20px 8px;
    text-align: center;
  }
  header.page h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: .04em; }
  header.page p { margin: 6px auto 0; max-width: 640px; color: var(--muted); font-size: 13px; }
  .modes { display: flex; gap: 8px; justify-content: center; margin: 14px 0 6px; }
  .modes button {
    font: inherit;
    border-radius: 999px;
    border: 1px solid #2a3a52;
    background: transparent;
    color: var(--ink);
    padding: 8px 14px;
    cursor: pointer;
  }
  .modes button.on { background: var(--gold); color: #1a1408; border-color: transparent; font-weight: 650; }
  .row {
    display: flex;
    gap: 22px;
    justify-content: center;
    align-items: flex-start;
    padding: 12px 16px 18px;
    flex-wrap: nowrap;
  }
  .col { width: 300px; }
  .col h2 { margin: 0 0 8px; text-align: center; font-size: 14px; font-weight: 650; color: var(--gold); }
  .col .why { margin: 8px 4px 0; color: var(--muted); font-size: 12px; text-align: center; min-height: 3.2em; }
  .phone {
    background: #0e1624;
    border: 1px solid #2a3a52;
    border-radius: 28px;
    padding: 14px 12px 16px;
    box-shadow: 0 16px 40px rgba(0,0,0,.35);
  }
  .top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 10px;
  }
  .top b { display: block; font-size: 15px; }
  .top small { color: var(--muted); font-size: 12px; }
  .count { text-align: right; font-size: 12px; color: var(--muted); }
  .dots { display: flex; gap: 4px; justify-content: flex-end; margin-top: 4px; }
  .dots i {
    width: 12px; height: 12px; border-radius: 50%; display: block;
    background: #f3f3f3;
  }
  .dots i.r { background: var(--red); }
  .felt {
    border-radius: 16px;
    padding: 10px;
    position: relative;
  }
  .felt.green {
    background:
      radial-gradient(120% 80% at 50% 0%, rgba(255,255,255,.08), transparent 46%),
      #146246;
    box-shadow: inset 0 0 0 7px #6a4630, inset 0 0 28px rgba(0,0,0,.28);
  }
  .felt.blue {
    background:
      radial-gradient(120% 80% at 50% 0%, rgba(180,220,255,.12), transparent 48%),
      #1a4e78;
    box-shadow: inset 0 0 0 7px #6a4630, inset 0 0 28px rgba(0,0,0,.3);
  }
  .felt.night {
    background:
      radial-gradient(90% 60% at 100% 0%, rgba(80,180,190,.22), transparent 42%),
      linear-gradient(#3a2c22, #241910);
    box-shadow: inset 0 0 40px rgba(0,0,0,.45);
  }
  .lights {
    display: flex; justify-content: space-between; padding: 0 8px 8px;
  }
  .lights span {
    width: 8px; height: 8px; border-radius: 50%;
    background: #f6d48a;
    box-shadow: 0 0 8px 2px rgba(246, 196, 110, .85);
  }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .card {
    display: block;
    width: 100%;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
    text-align: left;
    color: inherit;
    font: inherit;
  }
  .art { position: relative; aspect-ratio: 3 / 4; }
  .art img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,.35);
  }
  .pile { position: absolute; left: 4px; bottom: 4px; width: 52px; height: 40px; }
  .pile i {
    position: absolute;
    width: 15px; height: 15px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff6d2, #e2b14a 46%, #8d5e16);
    box-shadow: 0 1px 1px rgba(0,0,0,.5), inset 0 -2px 0 rgba(90,50,8,.35);
  }
  .pile[data-n]:hover::after {
    content: attr(data-n);
    position: absolute;
    left: 8px;
    bottom: 34px;
    background: #1a1408;
    color: #f6e2a2;
    font-size: 12px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 8px;
    z-index: 2;
  }
  .faces {
    position: absolute;
    right: 4px;
    bottom: 4px;
    display: flex;
    flex-direction: row-reverse;
    align-items: center;
  }
  .av {
    width: 22px; height: 22px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 750;
    border: 2px solid rgba(8,12,20,.75);
    margin-left: -7px;
  }
  .av:last-child { margin-left: 0; }
  .av.white { background: #f4f4f4; color: #161616; }
  .av.red { background: var(--red); color: #fff; }
  .av.q { background: #9aa0a8; color: #1c1c1c; margin-left: 0; }
  .av.more { background: #243044; color: #fff; font-size: 9px; }
  .mine { margin-top: 12px; }
  .mine-label { font-size: 12px; color: var(--muted); margin: 0 2px 6px; }
  .mine-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .mine .art img { border-radius: 6px; }
  .lb {
    position: fixed; inset: 0;
    background: rgba(6,10,16,.84);
    display: flex; align-items: center; justify-content: center;
    z-index: 5;
    padding: 24px;
  }
  .lb[hidden] { display: none; }
  .lb-card { width: min(72vh, 380px); }
  .lb-card .art img { border-radius: 12px; }
  .lb p { text-align: center; margin: 10px 0 0; color: #f6e2a2; font-weight: 650; }
  .hint { text-align: center; color: var(--muted); font-size: 12px; margin: 0 0 18px; }
</style>
</head>
<body>
<header class="page">
  <h1>Три варианта стола</h1>
  <p>Книжный экран. Сверху стол, снизу блок своих карт. Клик по карте увеличивает. Наведение на пачку монет показывает число.</p>
  <div class="modes">
    <button type="button" id="mode-open" class="on">Ставки видны</button>
    <button type="button" id="mode-hide">Скрытый раунд</button>
  </div>
</header>
<div class="row" id="phones"></div>
<p class="hint">Пустая карта — без кружков. Скрытый раунд: пачка одного размера и один серый «?», число и имена не читаются.</p>
<div class="lb" id="lb" hidden>
  <div>
    <div class="lb-card" id="lb-card"></div>
    <p id="lb-cap"></p>
  </div>
</div>
<script>
const PACK = '../../assets/packs/blue-dossier/';
const TABLE = [
  { src: '01.jpg', coins: 7, who: [{ s: 'white', n: 2 }, { s: 'red', n: 5 }] },
  { src: '04.jpg', coins: 3, who: [{ s: 'red', n: 1 }] },
  { src: '11.jpg', coins: 0, who: [] },
  { src: '16.jpg', coins: 12, who: [{ s: 'white', n: 4 }, { s: 'white', n: 6 }, { s: 'red', n: 3 }] }
];
const MINE = ['02.jpg', '06.jpg', '09.jpg', '10.jpg', '13.jpg', '03.jpg'];
const SKINS = [
  { id: 'green', title: 'Зелёное сукно', why: 'Классический стол. Риск: похоже на казино.' },
  { id: 'blue', title: 'Синее сукно', why: 'То же сукно, но в цвете департамента.' },
  { id: 'night', title: 'Ночной стол', why: 'Без сукна: тёмное дерево, гирлянда, как баннер.' }
];
const SPOTS = [[0,0],[13,0],[26,0],[6,10],[19,10],[0,19],[13,19],[26,18],[16,27]];
let hidden = false;

function heap(n) {
  if (!n) return '';
  const count = hidden ? 5 : Math.min(SPOTS.length, n);
  const coins = SPOTS.slice(0, count).map(([x, y]) => `<i style="left:${x}px;bottom:${y}px"></i>`).join('');
  const tip = hidden ? '' : ` data-n="${n}"`;
  return `<div class="pile"${tip}>${coins}</div>`;
}

function faces(who) {
  if (!who.length) return '';
  if (hidden) return '<div class="faces"><span class="av q">?</span></div>';
  const show = who.slice(0, 2);
  const more = who.length - show.length;
  const av = show.map((p) => `<span class="av ${p.s}">${p.n}</span>`).join('');
  const badge = more > 0 ? `<span class="av more">+${more}</span>` : '';
  return `<div class="faces">${av}${badge}</div>`;
}

function cardButton(item, big) {
  const overlay = heap(item.coins) + faces(item.who);
  return `<button type="button" class="card" data-src="${PACK}${item.src}" data-coins="${item.coins}" data-people="${item.who.length}">
    <div class="art"><img src="${PACK}${item.src}" alt="">${overlay}</div>
  </button>`;
}

function phone(skin) {
  const lights = skin.id === 'night'
    ? '<div class="lights"><span></span><span></span><span></span><span></span><span></span><span></span></div>'
    : '';
  const dots = [0,1,2,3,4,5].map((i) => `<i class="${i > 2 ? 'r' : ''}"></i>`).join('');
  const table = TABLE.map((c) => cardButton(c)).join('');
  const mine = MINE.map((src) => cardButton({ src, coins: 0, who: [] })).join('');
  return `<div class="col">
    <h2>${skin.title}</h2>
    <div class="phone">
      <div class="top">
        <div><b>Тур 3</b><small>ставки</small></div>
        <div class="count">6 за столом<div class="dots">${dots}</div></div>
      </div>
      <div class="felt ${skin.id}">${lights}<div class="grid">${table}</div></div>
      <section class="mine">
        <div class="mine-label">Мои карты</div>
        <div class="mine-grid">${mine}</div>
      </section>
    </div>
    <p class="why">${skin.why}</p>
  </div>`;
}

function render() {
  document.getElementById('phones').innerHTML = SKINS.map(phone).join('');
  document.getElementById('mode-open').classList.toggle('on', !hidden);
  document.getElementById('mode-hide').classList.toggle('on', hidden);
}

document.getElementById('mode-open').onclick = () => { hidden = false; render(); };
document.getElementById('mode-hide').onclick = () => { hidden = true; render(); };

document.getElementById('phones').onclick = (e) => {
  const btn = e.target.closest('.card');
  if (!btn) return;
  const coins = Number(btn.dataset.coins);
  const people = Number(btn.dataset.people);
  const item = { src: btn.dataset.src.replace(PACK, ''), coins, who: people ? [{}] : [] };
  const overlay = heap(coins) + (people ? faces(TABLE.find((c) => c.src === item.src)?.who || [{ s: 'white', n: 1 }]) : '');
  document.getElementById('lb-card').innerHTML = `<div class="art"><img src="${btn.dataset.src}" alt="">${overlay}</div>`;
  const cap = document.getElementById('lb-cap');
  if (!coins) cap.textContent = '';
  else if (hidden) cap.textContent = 'Ставка есть. Кто поставил — скрыто.';
  else cap.textContent = coins + ' золотых';
  document.getElementById('lb').hidden = false;
};

document.getElementById('lb').onclick = () => { document.getElementById('lb').hidden = true; };
render();
</script>
</body>
</html>
